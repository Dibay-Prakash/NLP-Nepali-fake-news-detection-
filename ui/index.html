<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nepali Fake News Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="header">
          <p class="kicker">Nepali News Verification</p>
          <h1>Check if a headline looks fake</h1>
          <p class="subhead">
            Paste a short Nepali news line and get an instant prediction.
          </p>
        </header>

        <form id="predict-form" class="form">
          <label class="label" for="news-text">News text</label>
          <textarea
            id="news-text"
            name="text"
            rows="5"
            placeholder="Type or paste a Nepali news line..."
            required
          ></textarea>
          <button id="predict-btn" type="submit">Analyze</button>
        </form>

        <section class="result" aria-live="polite">
          <div class="result-row">
            <span class="result-label">Prediction</span>
            <span id="result-label" class="result-value">-</span>
          </div>
          <div class="result-row">
            <span class="result-label">Confidence</span>
            <span id="result-prob" class="result-value">-</span>
          </div>
          <p id="result-error" class="result-error" role="alert"></p>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
